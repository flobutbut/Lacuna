<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="glow-pulsar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a0a0b0"/>
      <stop offset="50%" stop-color="#707080"/>
      <stop offset="100%" stop-color="#404050" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="beam-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6080a0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6080a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6080a0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6080a0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Beams (pulsar characteristic) -->
  <rect x="32" y="30" width="20" height="4" fill="url(#beam-h)"/>
  <rect x="30" y="32" width="4" height="20" fill="url(#beam-v)"/>
  <rect x="12" y="30" width="20" height="4" fill="url(#beam-h)" transform="scale(-1,1) translate(-64,0)"/>
  <rect x="30" y="12" width="4" height="20" fill="url(#beam-v)" transform="scale(1,-1) translate(0,-64)"/>
  <!-- Core -->
  <circle cx="32" cy="32" r="32" fill="url(#glow-pulsar)"/>
  <circle cx="32" cy="32" r="16" fill="#9098a8" fill-opacity="0.95"/>
</svg>
